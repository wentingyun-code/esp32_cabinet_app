workflows:
  ios-workflow:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.1
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.example.esp32CabinetApp

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA with code signing
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - wentingyun-code@users.noreply.github.com
        notify:
          success: true
          failure: true

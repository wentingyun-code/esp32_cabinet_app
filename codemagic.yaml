workflows:
  ios-workflow:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.1
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS without code signing
        script: flutter build ios --release --no-codesign

      - name: Create IPA
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          IPA_PATH="build/ios/ipa"
          mkdir -p "$IPA_PATH/Payload"
          cp -r "$APP_PATH" "$IPA_PATH/Payload/"
          cd "$IPA_PATH"
          zip -r app.ipa Payload/
          echo "IPA created at $IPA_PATH/app.ipa"

    artifacts:
      - build/ios/ipa/app.ipa

    publishing:
      email:
        recipients:
          - wentingyun-code@users.noreply.github.com
        notify:
          success: true
          failure: true

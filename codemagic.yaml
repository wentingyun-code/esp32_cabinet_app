workflows:
  ios-workflow:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.1
      xcode: latest
      vars:
        BUNDLE_ID: "com.example.esp32CabinetApp"

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods if needed
        script: |
          if [ -f ios/Podfile ]; then
            cd ios
            pod install
          else
            echo "No Podfile found, skipping CocoaPods install"
          fi

      - name: Set up code signing
        script: |
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --bundle-id "$BUNDLE_ID" \
            --code-signing-certificate "Apple Development" \
            --provisioning-profile-type "development"

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-method development

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - wentingyun-code@users.noreply.github.com
        notify:
          success: true
          failure: true

workflows:
  ios-workflow:
    name: iOS Release (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.1
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS without code signing
        script: |
          flutter build ios --release --no-codesign

      - name: Create IPA from unsigned build
        script: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r ../../../build/ios/app.ipa Payload/
          mv Payload/Runner.app . && rmdir Payload

    artifacts:
      - build/ios/app.ipa

    publishing:
      email:
        recipients:
          - wentingyun-code@users.noreply.github.com
        notify:
          success: true
          failure: true

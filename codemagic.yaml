workflows:
  ios-workflow:
    name: iOS Release (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.1
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS without code signing
        script: |
          flutter build ios --release --no-codesign

      - name: Create IPA from unsigned build
        script: |
          mkdir -p /tmp/Payload
          cp -r build/ios/iphoneos/Runner.app /tmp/Payload/
          zip -r /tmp/app.ipa /tmp/Payload/
          cp /tmp/app.ipa build/ios/app.ipa

    artifacts:
      - build/ios/app.ipa

    publishing:
      email:
        recipients:
          - wentingyun-code@users.noreply.github.com
        notify:
          success: true
          failure: true
